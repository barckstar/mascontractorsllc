name: Contact form health check

# Cada día llama a /api/contact en producción con el secreto del monitor (se salta
# el captcha, pero recorre el mismo camino: variables de Vercel -> EmailJS ->
# correo a la oficina). Si algo falla (EmailJS rechaza, key vencida, variable
# faltante, sitio caído) el job falla y GitHub avisa por correo.
on:
  schedule:
    - cron: "17 13 * * *" # 09:17 hora de Richmond (EDT) / 07:17 Costa Rica
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La página de contacto responde
        run: curl -fsS -o /dev/null --retry 3 --retry-delay 5 https://mascontractors.com/contact

      - name: Enviar correo de prueba por /api/contact
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          body=$(jq -n --arg d "$(date -u +%FT%TZ)" '{
            user_first_name:"[MONITOR]", user_last_name:"Chequeo diario",
            user_email:"monitor@mascontractors.com", user_phone:"000-000-0000",
            user_subject:"Test", user_language:"en",
            message:("Prueba automática \($d). Puedes ignorar este correo.")}')
          code=$(curl -sS -o resp.txt -w '%{http_code}' --retry 2 --retry-delay 10 \
            -H 'Content-Type: application/json' \
            -H "x-monitor-token: $MONITOR_SECRET" \
            -d "$body" https://mascontractors.com/api/contact)
          echo "HTTP $code: $(cat resp.txt)"
          [ "$code" = "200" ]
